[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apc-agent"
version = "0.2.0"
description = "MCP server for AWS Payment Cryptography — works with Claude Code, Codex CLI, and other MCP clients"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
apc-agent = "apc_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apc_agent"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[payment-cryptography]>=5.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # pyflakes — undefined names, unused imports
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade — use modern Python syntax
    "I",    # isort — import ordering
    "B",    # flake8-bugbear — likely bugs and design issues
    "SIM",  # flake8-simplify — redundant code patterns
]
ignore = [
    "E501",   # line too long — docstrings and notes strings are intentionally verbose
    "SIM108", # ternary operator — explicit if/else is clearer in compliance-critical paths
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real AWS credentials — set INTEGRATION_TESTS=true to run",
]
