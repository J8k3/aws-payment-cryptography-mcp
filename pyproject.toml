[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apc-agent"
version = "0.1.0"
description = "MCP server + Claude agent template for AWS Payment Cryptography"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
apc-agent = "apc_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apc_agent"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[payment-cryptography]>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real AWS credentials — set INTEGRATION_TESTS=true to run",
]
