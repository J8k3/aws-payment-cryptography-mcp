name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio "moto[payment-cryptography]" -e .
      - name: Lint
        run: ruff check src/ tests/
      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: pytest -v

  pack-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb@2.1.2
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Pack extension
        run: mcpb pack . "aws-payment-cryptography-mcp-${{ steps.version.outputs.version }}.mcpb"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            "aws-payment-cryptography-mcp-${{ steps.version.outputs.version }}.mcpb" \
            --title "AWS Payment Cryptography MCP ${{ github.ref_name }}" \
            --generate-notes
