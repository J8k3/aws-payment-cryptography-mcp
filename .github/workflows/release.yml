name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio "moto[payment-cryptography]" pyyaml -e .
      - name: Lint
        run: ruff check src/ tests/
      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: pytest -v

  pack-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb@2.1.2
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Pack extension
        run: mcpb pack . "aws-payment-cryptography-mcp-${{ steps.version.outputs.version }}.mcpb"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            "aws-payment-cryptography-mcp-${{ steps.version.outputs.version }}.mcpb" \
            --title "AWS Payment Cryptography MCP ${{ github.ref_name }}" \
            --generate-notes

  publish-mcp-registry:
    needs: pack-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC auth to the MCP registry (no secret needed)
      contents: write   # commit the synced server.json back to master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Pin server.json to this release (version, .mcpb URL, sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="aws-payment-cryptography-mcp-${VERSION}.mcpb"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          gh release download "${GITHUB_REF_NAME}" -p "${ASSET}" -O "/tmp/${ASSET}"
          SHA="$(sha256sum "/tmp/${ASSET}" | cut -d' ' -f1)"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA" \
            '.version=$v | .packages[0].version=$v | .packages[0].identifier=$url | .packages[0].fileSha256=$sha' \
            server.json > server.tmp && mv server.tmp server.json
          echo "--- patched server.json:"; cat server.json
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP registry
        run: ./mcp-publisher publish
      - name: Commit synced server.json back to master
        run: |
          if git diff --quiet -- server.json; then echo "server.json already current"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.json
          git commit -m "chore: sync server.json to ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:master
